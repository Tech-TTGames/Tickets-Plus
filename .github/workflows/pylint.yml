name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.1
      with:
        enable-cache: true
        cache-python: true
    - name: Install poetry requirements
      run: uv sync --dev
    - name: Analysing the code with pylint
      run: uv run pylint alembic tickets_plus toolbox --fail-under 10
